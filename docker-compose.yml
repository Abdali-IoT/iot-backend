services:
  backend:
    container_name: mqtt-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8081"
    environment:
      - MQTT__CLIENTID=dotnet-backend
      - MQTT__HOST=host.docker.internal
      - MQTT__USERNAME=mubarak
      - MQTT__PASSWORD=mubarak123
